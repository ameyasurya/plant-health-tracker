<!--
  Source artwork for the app and tray icon.

  This is the mascot's flower head in its "happy" (winking) state, lifted
  from src/components/Mascot.tsx so the icon and the in-app character stay
  the same drawing. The pot and leaves are deliberately left out: at 16-32px
  in a taskbar or tray the whole plant turns to mush, whereas the flower
  head still reads.

  Regenerate the PNG/ICO set with:  npx tauri icon app-icon.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 10 116 116" width="1024" height="1024">
  <defs>
    <radialGradient id="centre" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFC85C" />
      <stop offset="70%" stop-color="#F6A623" />
      <stop offset="100%" stop-color="#DE8C14" />
    </radialGradient>
  </defs>

  <!-- Petals: 7 ellipses radiating from the flower's centre of rotation. -->
  <g fill="#FFFFFF" stroke="#4A3524" stroke-width="2.5">
    <g transform="translate(100,68) rotate(0)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(51)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(103)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(154)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(206)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(257)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
    <g transform="translate(100,68) rotate(309)"><ellipse cx="34" cy="0" rx="19" ry="13" /></g>
  </g>
  <!-- Shaded petal bases, giving the petals a folded look. -->
  <g fill="#EFE9DC" opacity="0.7">
    <g transform="translate(100,68) rotate(0)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(51)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(103)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(154)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(206)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(257)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
    <g transform="translate(100,68) rotate(309)"><ellipse cx="26" cy="0" rx="7" ry="8.5" /></g>
  </g>

  <!-- Flower centre -->
  <circle cx="100" cy="72" r="33" fill="url(#centre)" stroke="#4A3524" stroke-width="3" />
  <!-- Faint seed texture, radiating from the middle. -->
  <g stroke="#C97A16" stroke-width="1.4" stroke-linecap="round" opacity="0.4">
    <line x1="112.0" y1="72.0" x2="119.0" y2="72.0" />
    <line x1="109.7" y1="79.1" x2="115.4" y2="83.2" />
    <line x1="103.7" y1="83.4" x2="105.9" y2="90.1" />
    <line x1="96.3" y1="83.4" x2="94.1" y2="90.1" />
    <line x1="90.3" y1="79.1" x2="84.6" y2="83.2" />
    <line x1="88.0" y1="72.0" x2="81.0" y2="72.0" />
    <line x1="90.3" y1="64.9" x2="84.6" y2="60.8" />
    <line x1="96.3" y1="60.6" x2="94.1" y2="53.9" />
    <line x1="103.7" y1="60.6" x2="105.9" y2="53.9" />
    <line x1="109.7" y1="64.9" x2="115.4" y2="60.8" />
  </g>

  <!-- Happy face: left eye winking shut, right eye open, broad smile. -->
  <g transform="translate(100,74)">
    <ellipse cx="-20" cy="8" rx="5" ry="3" fill="#F3A6A0" opacity="0.55" />
    <ellipse cx="20" cy="8" rx="5" ry="3" fill="#F3A6A0" opacity="0.55" />
    <circle cx="12" cy="-2" r="3.4" fill="#4A3524" />
    <circle cx="13.1" cy="-3.2" r="1" fill="#FFFFFF" />
    <path d="M-18,-4 Q-12,-9 -6,-4" stroke="#4A3524" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M-13,9 Q0,19 13,9" stroke="#4A3524" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
