name: Release

# Builds an installer per platform and attaches both to a GitHub Release.
#
# Runs on public-repo GitHub Actions minutes, which are free on the Windows
# and macOS runners alike. Triggered by pushing a version tag, plus a manual
# button for test runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    strategy:
      # One platform failing shouldn't discard a good build of the other:
      # each installer is useful on its own.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rust-targets: x86_64-pc-windows-msvc
            build-args: ""
            bundle-glob: src-tauri/target/release/bundle/nsis/*.exe
          # macos-latest is Apple Silicon, so a plain build produces an
          # arm64-only app that won't run on an Intel Mac. The universal
          # target covers both from this one runner. It costs a second
          # compile of everything, which is why it isn't the default.
          - os: macos-latest
            platform: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: "-- --target universal-apple-darwin"
            bundle-glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cargo's registry and the build directory are by far the slowest
      # part; keyed on Cargo.lock so it only rebuilds deps when they change.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run build
          cd src-tauri
          cargo test --all-targets

      - name: Build installer
        run: npm run tauri build ${{ matrix.build-args }}

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: error

  # Only publish a Release for an actual tag; workflow_dispatch runs just
  # leave the artifacts above for inspection. This is a separate job so the
  # release is created once, after both builds land, instead of two matrix
  # jobs racing to create the same draft.
  release:
    needs: build
    # `needs` on its own also demands that every matrix leg succeeded, so a
    # broken macOS build would silently block a perfectly good Windows
    # release. Run regardless and publish whatever did build: this creates a
    # draft, so the attached files get looked at before anyone can download
    # them.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
          body: |
            ## Install

            | Download | Platform |
            |---|---|
            | `.exe` | Windows |
            | `.dmg` | macOS, both Apple Silicon and Intel |

            ### Windows

            Download the `.exe` below and run it.

            **Windows will warn you the app is unsigned** -- it shows
            "Windows protected your PC". This is expected: a code-signing
            certificate costs money and this is a free hobby project.
            Click **More info** then **Run anyway** to continue.

            ### macOS

            Download the `.dmg`, open it, and drag the app into
            Applications. It is a universal build, so it runs on both
            Apple Silicon and Intel Macs.

            **macOS will refuse to open it the first time**, saying it
            cannot verify the developer. Notarising an app requires a paid
            Apple Developer account, so this build is unnotarised. Open
            **System Settings** then **Privacy & Security**, scroll down to
            the message naming the app, and click **Open Anyway**. This is
            only needed once.

            ### Either platform

            On first launch the plant list is empty. Use **+** to add
            plants from the built-in species catalog, and open
            **Settings** to set your location so watering can adjust to
            local rainfall and temperature.
