name: Release

# Builds the Windows installers and attaches them to a GitHub Release.
#
# Runs on public-repo GitHub Actions minutes, which are free. Triggered by
# pushing a version tag, plus a manual button for test runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the build directory are by far the slowest
      # part; keyed on Cargo.lock so it only rebuilds deps when they change.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run build
          cd src-tauri
          cargo test --all-targets

      # Signing here is the updater's minisign key, not Windows code signing.
      # It only proves an update came from this same keypair; SmartScreen
      # still warns, because that needs a paid certificate.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # The updater fetches this manifest, compares versions, then downloads
      # the installer named here and checks it against the signature.
      #
      # Note this Tauri version signs the NSIS setup .exe directly and emits
      # a sibling .sig; it does not produce the .nsis.zip the v1 updater
      # used. The manifest must therefore point at the .exe.
      - name: Build latest.json update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle/nsis
          VERSION="${GITHUB_REF_NAME#v}"
          SIG_FILE=$(ls "$BUNDLE"/*-setup.exe.sig)
          EXE_FILE="${SIG_FILE%.sig}"
          # GitHub rewrites spaces in asset names to dots on upload, so the
          # URL must use the rewritten form or the download 404s.
          ASSET=$(basename "$EXE_FILE" | tr ' ' '.')
          node -e '
            const fs = require("fs");
            const [sigFile, version, asset, repo] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(sigFile, "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/v${version}/${asset}`,
                },
              },
            }, null, 2));
          ' "$SIG_FILE" "$VERSION" "$ASSET" "${{ github.repository }}"
          cat latest.json

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Only publish a Release for an actual tag; workflow_dispatch runs
      # just leave the artifacts above for inspection.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
          body: |
            ## Install

            Download the `.exe` below and run it. The `.sig` and
            `latest.json` files are used by the in-app updater and can
            be ignored.

            **Windows will warn you the app is unsigned** -- it shows
            "Windows protected your PC". This is expected: a code-signing
            certificate costs money and this is a free hobby project.
            Click **More info** then **Run anyway** to continue.

            On first launch the plant list is empty. Use **+** to add
            plants from the built-in species catalog, and open
            **Settings** to set your location so watering can adjust to
            local rainfall and temperature.

            ## Updating

            From this version on, **Settings** has a **Check for updates**
            button that downloads and installs a new version in place. It
            only ever runs when you press it. Earlier versions have no
            updater, so this one has to be installed by hand.
