name: Release

# Builds the Windows installers and attaches them to a GitHub Release.
#
# Runs on public-repo GitHub Actions minutes, which are free. Triggered by
# pushing a version tag, plus a manual button for test runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the build directory are by far the slowest
      # part; keyed on Cargo.lock so it only rebuilds deps when they change.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run build
          cd src-tauri
          cargo test --all-targets

      - name: Build installers
        run: npm run tauri build

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Only publish a Release for an actual tag; workflow_dispatch runs
      # just leave the artifacts above for inspection.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ## Install

            Download the `.exe` (NSIS) installer below and run it.

            **Windows will warn you the app is unsigned** -- it shows
            "Windows protected your PC". This is expected: a code-signing
            certificate costs money and this is a free hobby project.
            Click **More info** then **Run anyway** to continue.

            On first launch the plant list is empty. Use **+** to add
            plants from the built-in species catalog, and open
            **Settings** to set your location so watering can adjust to
            local rainfall and temperature.
