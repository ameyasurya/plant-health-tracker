[package]
name = "plant-health-tracker"
version = "0.3.0"
description = "Desktop widget for tracking plant watering and feeding"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Restores the window's position and size across restarts. Hand-rolling this
# from Moved/Resized events is easy to get 90% right and awkward at the edges,
# notably restoring onto a monitor that is no longer attached.
tauri-plugin-window-state = "2"
# In-app update check. Downloads a signed installer from the GitHub release
# and runs it, so users no longer uninstall and reinstall by hand.
tauri-plugin-updater = "2"
# Lets the widget restart itself once an update has been applied.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Resolves the user's IANA timezone (from location setup) to a real local
# date, replacing the previously hardcoded IST offset.
chrono-tz = "0.10"
# Weather/geocoding calls live in Rust rather than the webview so the
# background reminder loop can use them with the UI closed. rustls avoids
# depending on the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
# used only by src-tauri/tests/schedule_tests.rs
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "plant-health-tracker"
path = "src/main.rs"

[lib]
name = "plant_health_tracker_lib"
path = "src/lib.rs"
